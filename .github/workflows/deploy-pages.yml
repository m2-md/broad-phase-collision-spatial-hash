name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci does not install the rollup Linux binary because of a missing optional
      # dependency in the lockfile (npm optional-dep bug); install resolves it per platform.
      # npm's optional-dependency bug (npm/cli#4828): the lockfile resolves without
      # @rollup/rollup-linux-x64-gnu, so the build cannot start. Dropping the lockfile
      # in the runner workspace lets npm resolve the binary for this platform.
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm test --if-present
        continue-on-error: true
      # Pages serves the project under a sub-path; base is passed on the CLI so the repo source stays unchanged.
      - run: npx vite build --base=/broad-phase-collision-spatial-hash/
      # Root-absolute page links break under a sub-path; rewrite them as relative in the build output.
      - name: Make cross-page links relative
        run: |
          find dist -name '*.html' -print0 | xargs -0 -r sed -i             -e 's|href="/\([A-Za-z0-9._-]*\.html\)"|href="./\1"|g'             -e 's|href="/"|href="./index.html"|g'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
